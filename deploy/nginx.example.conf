# An nginx site in front of the app, for projects.example.com (your GATEWAY_HOST).
# Install (sudo):
#   cp deploy/nginx.example.conf /etc/nginx/sites-available/projects.example.com
#   (replace projects.example.com with your host name, and 8040 if you changed GATEWAY_PORT)
#   ln -s /etc/nginx/sites-available/projects.example.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d projects.example.com     # adds the 443 block + the HTTP redirect
server {
    listen 80;
    server_name projects.example.com;

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Not for search engines (the SPA also sends noindex).
    add_header X-Robots-Tag "noindex, nofollow" always;
}
